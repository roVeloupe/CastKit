name: Build CastKit IPA

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install XcodeGen
      run: brew install xcodegen

    - name: Generate Xcode project
      run: xcodegen generate

    - name: Build (unsigned)
      id: build
      run: |
        mkdir -p build
        xcodebuild build \
          -project CastKit.xcodeproj \
          -scheme CastKit \
          -sdk iphoneos \
          -configuration Release \
          -derivedDataPath build/DerivedData \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGN_IDENTITY= \
          DEVELOPMENT_TEAM= \
          ONLY_ACTIVE_ARCH=YES > build/build.log 2>&1
        status=$?
        tail -n 120 build/build.log
        if [ $status -ne 0 ]; then
          echo "::error::$(tail -c 6000 build/build.log | sed 's/%/%25/g' | tr '\r' '%0D' | tr '\n' '%0A')"
          exit $status
        fi

    - name: Locate .app bundle
      id: app
      run: |
        APP_PATH=$(find build/DerivedData/Build/Products/Release-iphoneos -name "*.app" -maxdepth 1 -type d | head -1)
        echo "APP_PATH=$APP_PATH" >> "$GITHUB_OUTPUT"
        echo "$APP_PATH" > build/app_path.txt
        ls -la "$APP_PATH/"

    - name: Sign with enterprise cert (optional)
      if: env.ENTERPRISE_P12_BASE64 != ''
      env:
        CERT_NAME: ${{ secrets.ENTERPRISE_CERT_NAME }}
        ENTERPRISE_P12_BASE64: ${{ secrets.ENTERPRISE_P12_BASE64 }}
        ENTERPRISE_P12_PASSWORD: ${{ secrets.ENTERPRISE_P12_PASSWORD }}
      run: |
        set -e
        APP_PATH=$(cat build/app_path.txt)
        ENT_FILE="Resources/CastKit.entitlements"

        mkdir -p build/signing
        printf '%s' "$ENTERPRISE_P12_BASE64" | base64 --decode > build/signing/enterprise.p12

        KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
        KEYCHAIN_PASSWORD="$(head -c 16 /dev/urandom | xxd -p)"

        security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
        security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

        openssl pkcs12 -in build/signing/enterprise.p12 \
          -passin pass:"$ENTERPRISE_P12_PASSWORD" -nocerts -nodes \
          -out build/signing/private-key.pem 2>&1 | tail -1
        openssl pkcs12 -in build/signing/enterprise.p12 \
          -passin pass:"$ENTERPRISE_P12_PASSWORD" -nokeys \
          -out build/signing/cert.pem 2>&1 | tail -1

        security import build/signing/private-key.pem -A -k "$KEYCHAIN_PATH" 2>&1
        security import build/signing/cert.pem -A -k "$KEYCHAIN_PATH" 2>&1
        security list-keychains -s "$KEYCHAIN_PATH"
        security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

        codesign -f -s "$CERT_NAME" \
          --entitlements "$ENT_FILE" \
          --deep --options runtime \
          "$APP_PATH" 2>&1
        echo "signed with enterprise cert"

    - name: Ad-hoc sign (fallback)
      if: env.ENTERPRISE_P12_BASE64 == ''
      run: |
        APP_PATH=$(cat build/app_path.txt)
        codesign -f -s - \
          --entitlements "Resources/CastKit.entitlements" \
          --deep "$APP_PATH"
        echo "ad-hoc signed"

    - name: Package IPA
      run: |
        set -e
        APP_PATH=$(cat build/app_path.txt)
        IPA_NAME="CastKit-${GITHUB_SHA::7}.ipa"

        rm -rf build/Payload
        mkdir -p build/Payload
        cp -r "$APP_PATH" build/Payload/
        cd build && zip -qry "$IPA_NAME" Payload && cd ..

        echo "IPA_PATH=build/$IPA_NAME" >> "$GITHUB_OUTPUT"
        ls -la build/*.ipa

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: CastKit-iOS
        path: build/*.ipa
        if-no-files-found: error