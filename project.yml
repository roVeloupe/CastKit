name: CastKit
options:
  bundleIdPrefix: com.castkit
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    GENERATE_INFOPLIST_FILE: "NO"
    ENABLE_BITCODE: "NO"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    OTHER_LDFLAGS: "-lz"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

targets:
  CastKit:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - CastKit-Bridging-Header.h
      - path: Resources
        excludes:
          - "*.entitlements"
          - "Info.plist"
    settings:
      base:
        PRODUCT_NAME: CastKit
        PRODUCT_BUNDLE_IDENTIFIER: com.castkit.CastKit
        INFOPLIST_FILE: Resources/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: Sources/CastKit-Bridging-Header.h
        DEVELOPMENT_ASSET_PATHS: '""'
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0.0
    dependencies:
      - sdk: UIKit.framework
      - sdk: SwiftUI.framework
      - sdk: Combine.framework
      - sdk: WebKit.framework
      - sdk: CryptoKit.framework
      - sdk: Security.framework
    postBuildScripts:
      - name: Remove unsupported libs
        script: |
          set -e
    scheme:
      testTargets: []
      gatherCoverageData: false